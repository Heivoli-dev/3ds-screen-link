# Compile l'appli 3DS (.3dsx) et l'appli PC (.exe).
#
# Publier une mise à jour : change VERSION dans pc/screenlink_pc.py (ex. "1.0.1")
# puis pousse sur main. Si la release v1.0.1 n'existe pas encore, elle est créée
# automatiquement et l'appli PC propose la mise à jour.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 '^VERSION = ' pc/screenlink_pc.py | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! gh release view "v$V" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version v$V : une release sera créée"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # Vérifie que le décodeur son de la 3DS est identique à l'encodeur du PC (audioop)
  test-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          gcc -O2 -Wall -o adpcm_decode tests/adpcm_decode.c
          python -W ignore::DeprecationWarning tests/test_adpcm.py ./adpcm_decode

  build-3ds:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version
        run: sed -i "s/#define APP_VERSION .*/#define APP_VERSION     \"${{ needs.version.outputs.version }}\"/" 3ds/source/main.c

      - name: Dépendances
        run: |
          PKGS="3ds-libjpeg-turbo 3ds-curl 3ds-mbedtls 3ds-zlib"
          if dkp-pacman -Q $PKGS; then exit 0; fi
          for i in 1 2 3; do
            dkp-pacman -Sy --noconfirm --needed $PKGS && exit 0
            echo "Serveur devkitPro indisponible, nouvel essai dans 30 s..."; sleep 30
          done
          exit 1

      - name: Compilation
        run: make -C 3ds

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLink3DS
          path: 3ds/ScreenLink3DS.3dsx

  build-pc:
    needs: version
    runs-on: windows-latest
    # long : la signature attend l'approbation manuelle dans SignPath
    timeout-minutes: 90
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `pip install vgamepad` (et même `pip download`) exécute son setup.py, qui lance
      # l'installeur graphique de ViGEmBus et bloque un serveur sans écran.
      # On récupère donc l'archive sur PyPI et on copie le paquet à la main.
      - name: Dépendances
        timeout-minutes: 10
        run: |
          grep -v -i vgamepad pc/requirements.txt > req-ci.txt
          pip install -r req-ci.txt pyinstaller
          python - <<'PY'
          import io, json, sysconfig, tarfile, urllib.request
          meta = json.load(urllib.request.urlopen("https://pypi.org/pypi/vgamepad/json"))
          sdist = next(f for f in meta["urls"] if f["packagetype"] == "sdist")
          print("Téléchargement", sdist["filename"])
          data = urllib.request.urlopen(sdist["url"]).read()
          site = sysconfig.get_paths()["purelib"]
          with tarfile.open(fileobj=io.BytesIO(data)) as t:
              root = t.getnames()[0].split("/")[0]
              members = [m for m in t.getmembers() if m.name.startswith(root + "/vgamepad/")]
              for m in members:
                  m.name = m.name[len(root) + 1:]
              t.extractall(site, members=members)
          print(len(members), "fichiers copiés dans", site)
          PY

      - name: Création du .exe
        run: |
          cd pc
          python ../tools/make_version_info.py
          pyinstaller --onefile --noconsole --name ScreenLinkPC --version-file version_info.txt --icon icon.ico --add-data "icon.png;." --add-data "icon.ico;." --add-data "logo.png;." --collect-all vgamepad --hidden-import pyaudiowpatch --hidden-import audioop screenlink_pc.py
          cp screenlink_pc.py dist/

      # Signature gratuite SignPath Foundation (voir « Code signing policy » dans le README).
      # S'active seulement pour une nouvelle release, une fois le secret SIGNPATH_API_TOKEN
      # et la variable SIGNPATH_ORGANIZATION_ID ajoutés au dépôt.
      - name: Envoi du .exe à signer
        id: unsigned
        if: needs.version.outputs.release == 'true' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: ScreenLinkPC-unsigned
          path: pc/dist/ScreenLinkPC.exe

      - name: Signature (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || '3ds-screen-link' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 4800
          output-artifact-directory: pc/signed

      - name: Remplacement par le .exe signé
        if: steps.unsigned.outcome == 'success'
        run: cp pc/signed/ScreenLinkPC.exe pc/dist/ScreenLinkPC.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLinkPC
          path: |
            pc/dist/ScreenLinkPC.exe
            pc/dist/screenlink_pc.py

  # Appli Mac (Apple Silicon) : ScreenLinkPC.app zippé
  build-mac:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          brew install portaudio
          pip install -r pc/requirements.txt pyinstaller

      - name: Création du .app
        run: |
          cd pc
          pyinstaller --windowed --noconfirm --name ScreenLinkPC \
            --osx-bundle-identifier io.github.heivoli-dev.screenlink \
            --icon icon.png --add-data "icon.png:." --add-data "logo.png:." \
            --hidden-import pyaudio --hidden-import audioop screenlink_pc.py
          PLIST=dist/ScreenLinkPC.app/Contents/Info.plist
          V="${{ needs.version.outputs.version }}"
          plutil -replace CFBundleDisplayName -string "3DS Screen Link" "$PLIST"
          plutil -replace CFBundleShortVersionString -string "$V" "$PLIST"
          plutil -replace CFBundleVersion -string "$V" "$PLIST"
          plutil -replace NSHumanReadableCopyright -string "© 2026 heivoli-network.fr" "$PLIST"
          # macOS demande l'accord de l'utilisateur pour lire BlackHole (une entrée audio)
          plutil -replace NSMicrophoneUsageDescription -string \
            "Capte le son du Mac via BlackHole pour l'envoyer à la 3DS." "$PLIST"
          # le Info.plist a changé : nouvelle signature ad hoc (obligatoire sur Apple Silicon)
          codesign --force --deep --sign - dist/ScreenLinkPC.app
          codesign --verify --deep --strict dist/ScreenLinkPC.app
          ditto -c -k --keepParent dist/ScreenLinkPC.app dist/ScreenLinkPC-macOS.zip
          ls -la dist

      - name: Test de lancement
        run: |
          # l'appli doit au moins s'importer sans erreur (sans ouvrir de fenêtre)
          cd pc && python -c "import screenlink_pc as a; assert a.IS_MAC; print('OK', a.VERSION, a.CONFIG_PATH)"

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLinkPC-macOS
          path: pc/dist/ScreenLinkPC-macOS.zip

  release:
    needs: [version, test-audio, build-3ds, build-pc, build-mac]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy) · [Confidentialité](https://github.com/${{ github.repository }}#confidentialit%C3%A9)
          files: |
            out/ScreenLink3DS.3dsx
            out/ScreenLinkPC.exe
            out/ScreenLinkPC-macOS.zip
            out/screenlink_pc.py

      # Copie pour la mise à jour de l'appli 3DS : elle lit version.txt et le .3dsx
      # par l'API api.github.com (les fichiers de release passent par une
      # redirection que la 3DS n'arrive pas à suivre).
      - name: Publier dans la branche builds
        run: |
          mkdir pub && cd pub
          git init -q -b builds
          cp ../out/ScreenLink3DS.3dsx .
          echo "${{ needs.version.outputs.version }}" > version.txt
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Appli 3DS v${{ needs.version.outputs.version }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
