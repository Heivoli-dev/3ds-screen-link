# Compile l'appli 3DS (.3dsx) et l'appli PC (.exe).
#
# Publier une mise à jour : change VERSION dans pc/screenlink_pc.py (ex. "1.0.1")
# puis pousse sur main. Si la release v1.0.1 n'existe pas encore, elle est créée
# automatiquement et l'appli PC propose la mise à jour.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 '^VERSION = ' pc/screenlink_pc.py | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! gh release view "v$V" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version v$V : une release sera créée"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build-3ds:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version
        run: sed -i "s/#define APP_VERSION .*/#define APP_VERSION     \"${{ needs.version.outputs.version }}\"/" 3ds/source/main.c

      - name: Dépendances
        run: dkp-pacman -Sy --noconfirm --needed 3ds-libjpeg-turbo

      - name: Compilation
        run: make -C 3ds

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLink3DS
          path: 3ds/ScreenLink3DS.3dsx

  build-pc:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `pip install vgamepad` lance l'installeur graphique de ViGEmBus, qui bloque
      # un serveur sans écran : on copie donc le paquet à la main depuis son archive.
      - name: Dépendances
        run: |
          grep -v -i vgamepad pc/requirements.txt > req-ci.txt
          pip install -r req-ci.txt pyinstaller
          pip download vgamepad --no-deps --no-binary :all: -d dl
          mkdir src && tar xzf dl/vgamepad-*.tar.gz -C src
          SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cp -r src/vgamepad-*/vgamepad "$SITE/"
          ls -R "$SITE/vgamepad" | head -30

      - name: Création du .exe
        run: |
          cd pc
          pyinstaller --onefile --noconsole --name ScreenLinkPC --collect-all vgamepad screenlink_pc.py
          cp screenlink_pc.py dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLinkPC
          path: |
            pc/dist/ScreenLinkPC.exe
            pc/dist/screenlink_pc.py

  release:
    needs: [version, build-3ds, build-pc]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            out/ScreenLink3DS.3dsx
            out/ScreenLinkPC.exe
            out/screenlink_pc.py
